name: CI

# Every pull request. No exceptions, no skip label, no "it's just a config change".
# A Caddyfile edit can open the model to everyone; a blueprint edit can lock everyone
# out. Both look like config changes. The value of a gate is entirely in it never being
# bypassed, which is why `main` requires both jobs below to pass before anything merges.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Every image pinned by digest
        run: scripts/check_digests.sh

      - name: House text rules (no em or en dashes, no denylisted names)
        # The denylist is a repository secret, never a file. See scripts/check_text.sh.
        env:
          TEXT_DENYLIST: ${{ secrets.TEXT_DENYLIST }}
        run: scripts/check_text.sh

      - name: shellcheck
        run: shellcheck -x scripts/*.sh

      - name: yamllint
        run: |
          pip install --quiet yamllint==1.37.1
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 140}}}' \
            compose.yaml compose.gpu.yaml config/authentik/blueprints/ .github/workflows/

      - name: Compose file renders
        run: |
          cp .env.example .env
          sed -i 's/^\(AUTHENTIK_SECRET_KEY\|AUTHENTIK_DB_PASSWORD\|AUTHENTIK_BOOTSTRAP_PASSWORD\|LLM_CLIENT_TOKEN\)=$/\1=ci/' .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet

      - name: Caddyfile is valid
        run: |
          image=$(docker compose config --images | grep '^caddy:')
          docker run --rm -e AUTH_HOST=auth.localhost -e LLM_HOST=llm.localhost \
            -v "$PWD/config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$image" caddy validate --config /etc/caddy/Caddyfile

  integration:
    # The whole stack, on the pinned images, with the pinned model, exercised the way
    # its clients use it. Then a backup, and a restore drill against that backup.
    # Anything short of this tests the parts, and the failures live between them.
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The Ollama image is about 9 GB unpacked because it bundles GPU runtimes. A
        # stock runner has roughly 20 GB free, which is not enough headroom for it plus
        # Authentik plus a model. These directories are toolchains this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Generate secrets
        run: scripts/init_env.sh

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 600

      - name: Apply the SSO blueprint
        run: scripts/apply_blueprint.sh

      - name: Pull the pinned model (refuses if upstream moved)
        run: scripts/pull_model.sh

      - name: Smoke test
        run: scripts/smoke_test.sh

      - name: Backup
        run: |
          scripts/restic.sh init
          scripts/backup.sh

      - name: Restore drill
        run: scripts/restore_drill.sh

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200
          free -m

      - name: Tear down
        if: always()
        run: docker compose down -v
