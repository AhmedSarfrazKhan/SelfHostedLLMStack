name: Deploy

# Snapshot, deploy, prove it works from the outside, roll back on failure.
#
# Manual trigger only, and the reference host deliberately has no runner for it. The
# repository is public, and a self-hosted runner on a public repository can be made to
# run a stranger's code on the host. There, `scripts/deploy.sh --pull` is run by hand
# instead. It is the same procedure; this workflow only calls it. For a private
# repository with a dedicated host, this becomes `on: push: branches: [main]`.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, production]
    # The runner's checkout is the deployment. .env and secrets/ live in it and are
    # gitignored, so `clean: false` keeps them between runs.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          clean: false

      - name: Snapshot, deploy, smoke test, roll back on failure
        # The procedure lives in scripts/deploy.sh so that a deploy run by hand on the
        # host and a deploy run from here are the same thing. It takes HEAD~1 as the
        # rollback target, which is what was running before this push.
        run: scripts/deploy.sh
